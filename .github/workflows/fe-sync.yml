# FE 스토리북 스냅샷 자동 동기화 (2026-09-29)
# 매시간 FE 스토리북(Chromatic 브랜치 permalink)의 빌드 도장을 보고, 바뀌었을 때만 pnpm fe:sync → ds.css 재생성 → pnpm fe:parity(FE 화면과 계산 스타일 대조)
# → 통과하면 playground/fe-stories 를 봇이 커밋·푸시한다. 푸시되면 Vercel 이 평소처럼 배포한다.
# 실패(빨간 X)는 두 가지뿐: FE 스토리북이 안 열림(다음 시간에 자연 회복) / 새 FE 빌드가 우리 ds.css 위에서 다르게 그려짐(사람이 고칠 것 — 커밋하지 않는다).
# FE 가 스토리를 개명해 레지스트리 fe.id 가 목차에 없는 키는 실패가 아니다(2026-10-08) — 그 키만 이전 스냅샷을 두고 나머지를 커밋하며,
# fe-stories/index.json 의 missing 목록에 남는다. 관리자가 ds-registry.json 의 fe.id 를 고치면 다음 시간에 채워진다.
# 대조 분류(H2, 2026-10-14) — 정합 통과 뒤 pnpm fe:classify 가 FE 실제 값(fe-values.json)을 우리 값·대기 장부와 대조한다.
# 할 일(충돌 · Storybook 이 앞섬 · 원인 모를 차이 · 장부 닫기 · 댓글 미게시)이 있으면 커밋은 그대로 하고 마지막 단계에서 빨간 X 로 끝낸다
# → GitHub 가 메일을 보낸다. 보고서는 fe-requests/sync-report.md(실행 요약 화면에도 표시). FE 빌드가 바뀐 시간에만 돈다 = 빌드당 메일 1통.
# 수동 실행: Actions 탭 → FE Storybook sync → Run workflow.
name: FE Storybook sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 1. 빌드 도장만 본다 — 같으면 여기서 끝(의존성 설치도 안 한다)
      - name: FE 빌드 도장 대조
        id: check
        run: |
          node --input-type=module - <<'EOF' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          const reg = JSON.parse(fs.readFileSync("playground/public/ds-registry.json", "utf8"));
          const base = reg.$storybook.fe.base.replace(/\/$/, "");
          const html = await (await fetch(base + "/iframe.html")).text();
          const css = (html.match(/href="([^"]+\.css)"/) || [])[1] || "";
          const build = css.replace(/.*iframe-/, "").replace(/\.css$/, "") || "unknown";
          const prev = fs.existsSync("playground/fe-stories/index.json") ? JSON.parse(fs.readFileSync("playground/fe-stories/index.json", "utf8")).feBuild : "";
          console.error(`FE 빌드 ${build} · 스냅샷 ${prev || "(없음)"}`);
          console.log(`build=${build}`);
          console.log(`changed=${build !== prev && build !== "unknown"}`);
          EOF

      - if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.changed == 'true'
        name: Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      # 2. 가져온다 — Storybook 자체 목차의 모든 컴포넌트(레지스트리에 없으면 자동 등록). 렌더 오류가 있어도 여기서 멈추지 않고 2-1 관문이 판정한다
      - if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm fe:sync

      # 2-1. 게시 관문(안전장치, 2026-10-16) — 목차의 모든 스토리가 스냅샷에 있어야 다음으로 간다.
      # 빠진 컴포넌트만 다시 가져오기를 최대 3번. 그래도 안 맞으면 여기서 실패 = 커밋(게시)하지 않는다 → 이전 스냅샷이 그대로 살아 있고 메일이 간다
      - if: steps.check.outputs.changed == 'true'
        name: 게시 관문 — 목차 전부 있나
        run: |
          for i in 1 2 3 4; do
            if pnpm -s fe:coverage --gate; then echo "관문 통과(시도 $i)"; exit 0; fi
            [ "$i" = 4 ] && break
            retry=$(node -e 'console.log(require("./playground/fe-stories/coverage.json").gate.retry.join(" "))')
            echo "다시 가져오기 $i/3: $retry"
            pnpm fe:sync $retry || true
          done
          echo "관문 막힘 — 3번 다시 가져와도 목차의 스토리가 다 안 들어왔다. 게시하지 않는다(fe-requests/coverage-report.md)"
          exit 1

      # 3. 파일럿과 같은 검사 — 우리 ds.css 위에서 FE 화면과 같은가
      - if: steps.check.outputs.changed == 'true'
        name: ds.css + 정합 실측
        run: |
          node playground/scripts/mcp-artifacts.mjs
          node playground/scripts/build-ds-css.mjs
          (cd playground/public && python3 -m http.server 3000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &)
          sleep 2
          DS_BASE=http://127.0.0.1:3000 pnpm fe:parity

      # 4. 대조 분류 — 봇 커밋 전에 돌려야 git HEAD 의 fe-values.json 이 직전 빌드 값이다. 실패해도 커밋은 하고 6에서 빨갛게 끝낸다
      - if: steps.check.outputs.changed == 'true'
        name: 대조 분류
        id: classify
        continue-on-error: true
        run: pnpm fe:classify

      # 4-1. 커버리지 장부 — 렌더·값 결과까지 채운 최종 장부(목차 × 검사, "검사 안 함"도 숫자로). 실행 요약에도 한 줄
      - if: steps.check.outputs.changed == 'true'
        name: 커버리지 장부
        run: |
          pnpm -s fe:coverage | tee /tmp/coverage.txt
          { echo "### 커버리지"; cat /tmp/coverage.txt; } >> "$GITHUB_STEP_SUMMARY"

      # 5. 통과했으면 봇이 커밋·푸시 — Vercel 이 배포한다
      - if: steps.check.outputs.changed == 'true'
        name: 커밋
        run: |
          git config user.name "fe-sync[bot]"
          git config user.email "fe-sync@users.noreply.github.com"
          git add playground/fe-stories playground/public/ds-registry.json fe-requests/sync-report.md fe-requests/sync-report.json fe-requests/coverage-report.md
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(fe): FE 스토리북 스냅샷 동기화 — 빌드 ${{ steps.check.outputs.build }}" -m "자동 실행(.github/workflows/fe-sync.yml). pnpm fe:sync → fe:parity 통과."
          git push

      # 6. 할 일이 있으면 빨간 X — GitHub 가 메일을 보낸다(보고서: 실행 요약 · fe-requests/sync-report.md)
      - if: steps.check.outputs.changed == 'true' && steps.classify.outcome == 'failure'
        name: 할 일 있음 — 확인 필요
        run: |
          echo "FE 대조 결과 할 일이 있다 — fe-requests/sync-report.md 확인"
          exit 1
